apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: demo-service
  description: "Dịch vụ dùng để demo Global Map"
  annotations:
    backstage.io/techdocs-ref: dir:./docs
spec:
  type: service
  owner: pie-team
  system: demo-system
  lifecycle: production
  providesApis:
    - demo-api
  consumesApis:
    - content-api
  dependsOn:
    - resource:sms-db
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: demo-api
spec:
  type: openapi
  lifecycle: production
  owner: pie-team
  definition:
    $text: ./api/prod/openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sms-db
spec:
  type: database
  owner: iti-team
  system: demo-system

